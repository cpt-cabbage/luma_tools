<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 3D Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e1e1e;
        }
        #container {
            width: 100%;
            height: 100%;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #888;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            text-align: center;
        }
        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #0af;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f55;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            text-align: center;
            max-width: 80%;
            display: none;
        }
    </style>
    <!-- QWebChannel for Python communication -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>

    <!-- Queue for commands before viewer is ready -->
    <script>
        window._viewerReady = false;
        window._pendingModel = null;
        // Note: All other functions are directly assigned after Three.js module loads
    </script>

    <!-- Import map for Three.js ES modules -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="container"></div>
    <div id="loading">
        <div class="spinner"></div>
        <div>Loading viewer...</div>
    </div>
    <div id="error"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
        import { EXRLoader } from 'three/addons/loaders/EXRLoader.js';

        // Global state
        let scene, camera, renderer, controls;
        let currentModel = null;
        let mixer = null;
        let clock = new THREE.Clock();
        let animations = [];
        let currentAction = null;
        let bridge = null;
        let viewMode = 'textured';
        let gridHelper = null;
        let axesHelper = null;
        let skeletonHelper = null;
        let initComplete = false;  // Track if Three.js init is done
        let cameraDistance = 3.5;  // Default camera distance (configurable via settings)
        let activeLoadUrl = null;  // Track currently loading model URL to prevent race conditions

        // Lighting and shading state
        let lightingMode = 'studio';  // 'headlight', 'studio', 'hdri'
        let shadingMode = 'textured'; // 'shaded', 'textured', 'wireframe'
        let lightStrength = 1.0;      // Light intensity multiplier (0.1 to 3.0)
        let ambientLight = null;
        let keyLight = null;
        let fillLight = null;
        let rimLight = null;
        let headlight = null;
        let pmremGenerator = null;
        let envTexture = null;

        // Initialize scene
        function init() {
            const container = document.getElementById('container');

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e1e1e);

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3, 2, 3);

            // Renderer - preserveDrawingBuffer needed for screenshots
            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            container.appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = true;
            controls.minDistance = 0.1;
            controls.maxDistance = 100;

            // Swap middle mouse button from zoom to pan
            controls.mouseButtons = {
                LEFT: THREE.MOUSE.ROTATE,
                MIDDLE: THREE.MOUSE.PAN,
                RIGHT: THREE.MOUSE.DOLLY
            };

            // Initialize PMREMGenerator for HDRI environment maps
            pmremGenerator = new THREE.PMREMGenerator(renderer);
            pmremGenerator.compileEquirectangularShader();

            // Setup all lights
            setupLights();

            // Apply initial lighting mode (studio by default)
            setLightingModeImpl(lightingMode);

            // Grid
            gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x333333);
            scene.add(gridHelper);

            // Axis helper
            axesHelper = new THREE.AxesHelper(1);
            scene.add(axesHelper);

            // Handle resize
            window.addEventListener('resize', onWindowResize, false);

            // Hide loading indicator
            document.getElementById('loading').style.display = 'none';

            // Start animation loop
            animate();

            // Mark viewer as ready and process any pending loads
            window._viewerReady = true;
            initComplete = true;
            console.log('Three.js viewer ready');

            if (window._pendingModel) {
                console.log('Loading pending model:', window._pendingModel);
                loadModelImpl(window._pendingModel);
                window._pendingModel = null;
            }

            // Notify Python that viewer is ready (if QWebChannel is connected)
            signalViewerReady();
        }

        // Signal to Python that the viewer is fully ready
        function signalViewerReady() {
            if (initComplete && bridge) {
                console.log('Signaling Python: viewer ready');
                bridge.onViewerReady();
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Update animation mixer
            if (mixer) {
                const delta = clock.getDelta();
                mixer.update(delta);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Dispose of a Three.js object and all its children (geometries, materials, textures)
        function disposeObject(obj) {
            if (!obj) return;

            // Recursively dispose children first
            if (obj.children) {
                while (obj.children.length > 0) {
                    disposeObject(obj.children[0]);
                    obj.remove(obj.children[0]);
                }
            }

            // Dispose geometry
            if (obj.geometry) {
                obj.geometry.dispose();
            }

            // Dispose material(s)
            if (obj.material) {
                if (Array.isArray(obj.material)) {
                    obj.material.forEach(mat => disposeMaterial(mat));
                } else {
                    disposeMaterial(obj.material);
                }
            }

            // Dispose skeleton
            if (obj.skeleton) {
                obj.skeleton.dispose();
            }
        }

        // Dispose a material and its textures
        function disposeMaterial(material) {
            if (!material) return;

            // Dispose all texture properties
            const textureProps = ['map', 'normalMap', 'roughnessMap', 'metalnessMap',
                                  'aoMap', 'emissiveMap', 'bumpMap', 'displacementMap',
                                  'alphaMap', 'envMap', 'lightMap', 'specularMap'];
            textureProps.forEach(prop => {
                if (material[prop]) {
                    material[prop].dispose();
                }
            });

            material.dispose();
        }

        // Load 3D model implementation
        function loadModelImpl(url) {
            console.log('Loading model:', url);

            // Cancel any previous load in progress by marking it as stale
            // When the old load completes, it will check if activeLoadUrl matches before adding to scene
            const thisLoadUrl = url;
            activeLoadUrl = thisLoadUrl;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').querySelector('div:last-child').textContent = 'Loading model...';
            document.getElementById('error').style.display = 'none';

            // Clear existing model - MUST dispose resources to free GPU memory
            if (currentModel) {
                disposeObject(currentModel);
                scene.remove(currentModel);
                currentModel = null;
            }
            if (skeletonHelper) {
                skeletonHelper.dispose();
                scene.remove(skeletonHelper);
                skeletonHelper = null;
            }
            if (mixer) {
                mixer.stopAllAction();
                mixer.uncacheRoot(mixer.getRoot());
                mixer = null;
            }
            animations = [];
            currentAction = null;

            // Determine loader based on file extension
            const extension = url.split('.').pop().toLowerCase().split('?')[0];
            let loader;

            if (extension === 'glb' || extension === 'gltf') {
                loader = new GLTFLoader();
                // Setup Draco decoder for compressed models
                const dracoLoader = new DRACOLoader();
                dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/');
                loader.setDRACOLoader(dracoLoader);
            } else if (extension === 'fbx') {
                loader = new FBXLoader();
            } else if (extension === 'obj') {
                loader = new OBJLoader();
            } else {
                showError(`Unsupported format: .${extension}`);
                return;
            }

            loader.load(
                url,
                function(result) {
                    // Race condition protection: Check if this load is still the active one
                    // If user clicked "next" rapidly, a newer load may have started
                    if (activeLoadUrl !== thisLoadUrl) {
                        console.log('Load cancelled (newer load started):', thisLoadUrl);
                        // Dispose the loaded model since we won't be using it
                        if (result.scene) {
                            disposeObject(result.scene);
                        } else if (result) {
                            disposeObject(result);
                        }
                        return;
                    }

                    let model;

                    // GLTFLoader returns { scene, animations, ... }
                    if (result.scene) {
                        model = result.scene;
                        animations = result.animations || [];
                    } else {
                        model = result;
                        // FBXLoader may have animations directly on the model
                        if (result.animations && result.animations.length > 0) {
                            animations = result.animations;
                        }
                    }

                    // Setup model
                    currentModel = model;
                    scene.add(model);

                    // Enable shadows on meshes
                    model.traverse(function(child) {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });

                    // Get original bounds before any transforms
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);

                    // Normalize scale - target max dimension of ~2 units
                    const targetSize = 2.0;
                    const scaleFactor = maxDim > 0 ? targetSize / maxDim : 1.0;
                    model.scale.multiplyScalar(scaleFactor);

                    // Scale the positioning values (simpler than recomputing bounds)
                    const scaledMinY = box.min.y * scaleFactor;
                    const scaledCenterX = center.x * scaleFactor;
                    const scaledCenterZ = center.z * scaleFactor;
                    const scaledSizeY = size.y * scaleFactor;

                    // Center horizontally, put bottom at ground level
                    model.position.set(-scaledCenterX, -scaledMinY, -scaledCenterZ);

                    // Setup animation mixer
                    if (animations.length > 0) {
                        mixer = new THREE.AnimationMixer(model);

                        // Notify Python about available animations
                        const animNames = animations.map(a => a.name || 'Unnamed');
                        if (bridge) {
                            bridge.onAnimationsFound(JSON.stringify(animNames));
                        }

                        // Auto-play first animation
                        playAnimationImpl();
                    }

                    // Create skeleton helper if model has bones
                    model.traverse(function(child) {
                        if (child.isSkinnedMesh && child.skeleton) {
                            skeletonHelper = new THREE.SkeletonHelper(model);
                            skeletonHelper.visible = (viewMode === 'skeleton');
                            scene.add(skeletonHelper);
                            return;
                        }
                    });

                    // Apply current view mode
                    applyViewMode();

                    // Apply current lighting settings to materials
                    updateMaterialsForLighting();

                    // Hide loading, show success
                    document.getElementById('loading').style.display = 'none';

                    // Notify Python
                    if (bridge) {
                        bridge.onModelLoaded(url);
                    }

                    console.log('Model loaded successfully:', url);
                    console.log('Animations found:', animations.length);
                },
                function(progress) {
                    // Progress callback
                    if (progress.lengthComputable) {
                        const percent = Math.round((progress.loaded / progress.total) * 100);
                        document.getElementById('loading').querySelector('div:last-child').textContent =
                            `Loading... ${percent}%`;
                    }
                },
                function(error) {
                    console.error('Error loading model:', error);
                    showError(`Failed to load model:\n${error.message || error}`);
                    if (bridge) {
                        bridge.onLoadError(error.message || String(error));
                    }
                }
            );
        }

        // Play animation implementation
        function playAnimationImpl(name) {
            if (!mixer || animations.length === 0) return;

            // Stop current action
            if (currentAction) {
                currentAction.stop();
            }

            // Find animation by name or use first one
            let clip;
            if (name) {
                clip = animations.find(a => a.name === name);
            }
            if (!clip) {
                clip = animations[0];
            }

            if (clip) {
                currentAction = mixer.clipAction(clip);
                currentAction.reset();
                currentAction.play();
            }
        }

        // Stop animation implementation
        function stopAnimationImpl() {
            if (currentAction) {
                currentAction.stop();
            }
        }

        // Set animation time implementation (normalized 0-1)
        function setAnimationTimeImpl(timeNormalized) {
            if (!mixer || !currentAction) return;

            const clip = currentAction.getClip();
            const time = timeNormalized * clip.duration;
            mixer.setTime(time);
        }

        // Set view mode implementation
        function setViewModeImpl(mode) {
            viewMode = mode;
            applyViewMode();
        }

        // Set camera distance for model loading
        function setCameraDistanceImpl(dist) {
            cameraDistance = dist;
        }

        function applyViewMode() {
            if (!currentModel) return;

            currentModel.traverse(function(child) {
                if (child.isMesh) {
                    switch (viewMode) {
                        case 'wireframe':
                            child.material.wireframe = true;
                            child.visible = true;
                            break;
                        case 'skeleton':
                            child.visible = false;
                            break;
                        case 'textured':
                        default:
                            child.material.wireframe = false;
                            child.visible = true;
                            break;
                    }
                }
            });

            // Show/hide skeleton helper
            if (skeletonHelper) {
                skeletonHelper.visible = (viewMode === 'skeleton');
            }
        }

        // Setup all lights (called once during init)
        function setupLights() {
            // Ambient light (used in all modes, intensity varies)
            // Store base intensity, will be multiplied by lightStrength
            ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            ambientLight.userData.baseIntensity = 0.3;
            scene.add(ambientLight);

            // Headlight (follows camera) - attached to camera so it moves with view
            headlight = new THREE.DirectionalLight(0xffffff, 1.0);
            headlight.userData.baseIntensity = 1.0;
            headlight.position.set(0, 0, 1);
            camera.add(headlight);
            scene.add(camera);  // Camera must be in scene for headlight to work
            headlight.visible = false;

            // Studio Key light (warm, strong, with shadows) - front right
            keyLight = new THREE.DirectionalLight(0xfff5e6, 1.0);
            keyLight.userData.baseIntensity = 1.0;
            keyLight.position.set(5, 10, 5);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            keyLight.shadow.camera.near = 0.1;
            keyLight.shadow.camera.far = 50;
            keyLight.shadow.camera.left = -10;
            keyLight.shadow.camera.right = 10;
            keyLight.shadow.camera.top = 10;
            keyLight.shadow.camera.bottom = -10;
            scene.add(keyLight);

            // Studio Fill light (cool, softer) - left side
            fillLight = new THREE.DirectionalLight(0xe6f0ff, 0.4);
            fillLight.userData.baseIntensity = 0.4;
            fillLight.position.set(-5, 5, -5);
            scene.add(fillLight);

            // Studio Rim/Back light - behind subject
            rimLight = new THREE.DirectionalLight(0xffffff, 0.3);
            rimLight.userData.baseIntensity = 0.3;
            rimLight.position.set(0, 5, -10);
            scene.add(rimLight);
        }

        // Set lighting mode
        function setLightingModeImpl(mode) {
            lightingMode = mode;

            // Disable all lights first
            headlight.visible = false;
            keyLight.visible = false;
            fillLight.visible = false;
            rimLight.visible = false;

            // Clear environment map
            scene.environment = null;
            scene.background = new THREE.Color(0x1e1e1e);

            switch (mode) {
                case 'headlight':
                    headlight.visible = true;
                    ambientLight.userData.baseIntensity = 0.2;
                    break;

                case 'studio':
                    keyLight.visible = true;
                    fillLight.visible = true;
                    rimLight.visible = true;
                    ambientLight.userData.baseIntensity = 0.3;
                    break;

                case 'hdri':
                    // HDRI mode - environment provides lighting
                    ambientLight.userData.baseIntensity = 0.1;
                    if (envTexture) {
                        scene.environment = envTexture;
                        // Don't set as background - keep dark bg
                    }
                    break;
            }

            // Apply light strength to all lights
            applyLightStrength();

            // Update materials for new lighting mode
            updateMaterialsForLighting();

            console.log('Lighting mode set to:', mode);
        }

        // Load HDRI environment map
        function loadHdriImpl(url) {
            console.log('Loading HDRI:', url);

            const extension = url.split('.').pop().toLowerCase().split('?')[0];
            const loader = extension === 'exr' ? new EXRLoader() : new RGBELoader();

            loader.load(url, function(texture) {
                console.log('HDRI texture loaded, generating environment map...');
                console.log('Texture size:', texture.image?.width, 'x', texture.image?.height);

                // Generate environment map from equirectangular texture
                envTexture = pmremGenerator.fromEquirectangular(texture).texture;
                texture.dispose();

                console.log('Environment map generated successfully');

                // Apply if in HDRI mode
                if (lightingMode === 'hdri') {
                    scene.environment = envTexture;
                    console.log('Applied HDRI to scene.environment');
                }

                // Update materials to use new environment
                updateMaterialsForLighting();

                console.log('HDRI loaded successfully:', url);

                // Notify Python
                if (bridge && bridge.onHdriLoaded) {
                    bridge.onHdriLoaded(url);
                }
            }, function(progress) {
                if (progress.lengthComputable) {
                    const percent = Math.round((progress.loaded / progress.total) * 100);
                    console.log(`HDRI loading: ${percent}%`);
                }
            }, function(error) {
                console.error('Error loading HDRI:', error);
                if (bridge && bridge.onHdriLoadError) {
                    bridge.onHdriLoadError(error.message || String(error));
                }
            });
        }

        // Update material properties based on lighting mode
        function updateMaterialsForLighting() {
            if (!currentModel) return;

            let materialCount = 0;
            let updatedCount = 0;

            currentModel.traverse(function(child) {
                if (child.isMesh && child.material) {
                    // Handle both single materials and material arrays
                    const materials = Array.isArray(child.material) ? child.material : [child.material];

                    materials.forEach(function(material) {
                        materialCount++;

                        // Update all material types, not just PBR
                        // Convert basic materials to standard materials if needed
                        if (material.isMeshBasicMaterial) {
                            console.log('Warning: MeshBasicMaterial found - cannot display reflections');
                        }

                        // Update PBR materials (MeshStandardMaterial, MeshPhysicalMaterial)
                        if (material.isMeshStandardMaterial || material.isMeshPhysicalMaterial) {
                            // In HDRI mode, explicitly set the environment map on the material
                            if (lightingMode === 'hdri' && envTexture) {
                                material.envMap = envTexture;
                                material.envMapIntensity = 1.0 * lightStrength;

                                // Make material more reflective for better HDRI visibility
                                // Store original values if not already stored
                                if (!material.userData.originalRoughness) {
                                    material.userData.originalRoughness = material.roughness;
                                    material.userData.originalMetalness = material.metalness;
                                }

                                // Boost reflectivity for better HDRI visibility
                                // Apply more aggressive settings for demo purposes
                                if (material.roughness > 0.5) {
                                    material.roughness = 0.3;  // Make much smoother for clear reflections
                                }
                                if (material.metalness < 0.5) {
                                    material.metalness = 0.7;  // Strong metalness for obvious HDRI reflections
                                }

                                updatedCount++;
                            } else {
                                // In non-HDRI modes, restore original values or use scene environment
                                if (material.userData.originalRoughness !== undefined) {
                                    material.roughness = material.userData.originalRoughness;
                                    material.metalness = material.userData.originalMetalness;
                                }
                                material.envMap = envTexture || null;
                                material.envMapIntensity = 0.3 * lightStrength;
                            }
                            material.needsUpdate = true;
                        }
                    });
                }
            });

            console.log(`Updated materials: ${updatedCount}/${materialCount} (lighting: ${lightingMode}, strength: ${lightStrength.toFixed(2)})`);
        }

        // Set light strength multiplier (0.1 to 3.0)
        function setLightStrengthImpl(strength) {
            lightStrength = Math.max(0.1, Math.min(3.0, strength));
            applyLightStrength();
            console.log('Light strength set to:', lightStrength);
        }

        // Apply current light strength to all lights
        function applyLightStrength() {
            if (ambientLight) {
                ambientLight.intensity = ambientLight.userData.baseIntensity * lightStrength;
            }
            if (headlight) {
                headlight.intensity = headlight.userData.baseIntensity * lightStrength;
            }
            if (keyLight) {
                keyLight.intensity = keyLight.userData.baseIntensity * lightStrength;
            }
            if (fillLight) {
                fillLight.intensity = fillLight.userData.baseIntensity * lightStrength;
            }
            if (rimLight) {
                rimLight.intensity = rimLight.userData.baseIntensity * lightStrength;
            }

            // Update HDRI environment map intensity on materials
            updateMaterialsForLighting();
        }

        // Set shading mode (shaded, textured, wireframe)
        function setShadingModeImpl(mode) {
            shadingMode = mode;

            if (!currentModel) return;

            currentModel.traverse(function(child) {
                if (child.isMesh) {
                    switch (mode) {
                        case 'shaded':
                            // Show material colors but no textures
                            child.material.wireframe = false;
                            child.visible = true;
                            // Store original map if not already stored
                            if (child.material.map && !child.userData.originalMap) {
                                child.userData.originalMap = child.material.map;
                            }
                            // Disable texture
                            if (child.userData.originalMap) {
                                child.material.map = null;
                            }
                            child.material.needsUpdate = true;
                            break;

                        case 'textured':
                            // Full materials with textures (restore if disabled)
                            child.material.wireframe = false;
                            child.visible = true;
                            // Restore original map if we stored it
                            if (child.userData.originalMap) {
                                child.material.map = child.userData.originalMap;
                            }
                            child.material.needsUpdate = true;
                            break;

                        case 'wireframe':
                            child.material.wireframe = true;
                            child.visible = true;
                            break;
                    }
                }
            });

            // Hide skeleton in shading modes (skeleton is viewMode, not shadingMode)
            if (skeletonHelper) {
                skeletonHelper.visible = false;
            }

            console.log('Shading mode set to:', mode);
        }

        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // Capture screenshot as base64 PNG
        function captureScreenshotImpl(size) {
            if (!renderer || !scene || !camera) {
                console.error('Cannot capture screenshot: viewer not ready');
                return null;
            }

            // Store original size
            const origWidth = renderer.domElement.width;
            const origHeight = renderer.domElement.height;

            // Hide grid and axis helpers for clean thumbnail
            const gridWasVisible = gridHelper ? gridHelper.visible : false;
            const axesWasVisible = axesHelper ? axesHelper.visible : false;
            if (gridHelper) gridHelper.visible = false;
            if (axesHelper) axesHelper.visible = false;

            // Resize renderer for thumbnail
            const targetSize = size || 150;
            renderer.setSize(targetSize, targetSize);
            camera.aspect = 1;
            camera.updateProjectionMatrix();

            // Render to the resized canvas
            renderer.render(scene, camera);

            // Get image data
            const dataUrl = renderer.domElement.toDataURL('image/png');

            // Restore grid and axis visibility
            if (gridHelper) gridHelper.visible = gridWasVisible;
            if (axesHelper) axesHelper.visible = axesWasVisible;

            // Restore original size
            renderer.setSize(origWidth, origHeight);
            camera.aspect = origWidth / origHeight;
            camera.updateProjectionMatrix();

            // Render again at original size
            renderer.render(scene, camera);

            console.log('Screenshot captured at', targetSize, 'x', targetSize);
            return dataUrl;
        }

        // Expose functions to global scope
        // loadModel needs special handling for queuing during early load
        window.loadModel = function(url) {
            if (window._viewerReady) {
                loadModelImpl(url);
            } else {
                console.log('Queuing model load:', url);
                window._pendingModel = url;
            }
        };
        window.playAnimation = playAnimationImpl;
        window.stopAnimation = stopAnimationImpl;
        window.setAnimationTime = setAnimationTimeImpl;
        window.setViewMode = setViewModeImpl;
        window.setCameraDistance = setCameraDistanceImpl;
        window.setLightingMode = setLightingModeImpl;
        window.setShadingMode = setShadingModeImpl;
        window.loadHdri = loadHdriImpl;
        window.setLightStrength = setLightStrengthImpl;
        window.captureScreenshot = captureScreenshotImpl;

        // Setup QWebChannel bridge
        if (typeof QWebChannel !== 'undefined') {
            new QWebChannel(qt.webChannelTransport, function(channel) {
                bridge = channel.objects.bridge;
                console.log('QWebChannel connected');
                // If init already completed, signal Python now
                signalViewerReady();
            });
        } else {
            console.log('QWebChannel not available (standalone mode)');
        }

        // Initialize when DOM is ready
        init();
    </script>
</body>
</html>
